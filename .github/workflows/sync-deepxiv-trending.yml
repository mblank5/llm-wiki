name: Sync DeepXiv Trending Papers

on:
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deepxiv-trending
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PAPER_API_BASE: ${{ secrets.PAPER_API_BASE }}
      PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}
      PAPER_MODEL: ${{ secrets.PAPER_MODEL }}
      DEEPXIV_TOKEN: ${{ secrets.DEEPXIV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install markdown pyyaml python-dotenv openai deepxiv-sdk

      - name: Sync weekly trending papers
        run: |
          if [ -z "$PAPER_MODEL" ]; then
            export PAPER_MODEL="LongCat-Flash-Chat"
          fi
          python3 scripts/sync-deepxiv-trending.py . --days 7 --limit 30 --workers 2

      - name: Audit paper briefs
        run: python3 scripts/audit-paper-briefs.py . --max-findings 80

      - name: Generate static site
        run: python3 scripts/generate-web.py

      - name: Validate generated search index
        run: python3 -m json.tool web/output/search-index.json > /dev/null

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No trending changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hot raw/papers paper-briefs papers web/output/search-index.json
          git commit -m "chore: sync deepxiv weekly trending papers"
          git push
